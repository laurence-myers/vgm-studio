name: Check Rust

on:
  - push
  - pull_request

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: windows-latest

    steps:
      # `submodules: recursive` everywhere: the C sound cores and the vgmtools
      # optimisers build from vendor/upstream submodules, so every job that
      # invokes cargo needs them checked out.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The toolchain, its components and the wasm target all come from
      # rust-toolchain.toml, which rustup applies on the first cargo invocation.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  wasm:
    name: wasm32 cleanliness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # The C sound cores compile to wasm through clang (`-ffreestanding`); the
      # worklet and app modules link them, so the wasm job needs a C compiler
      # that can target wasm32. lld is for the wasip1 tool build below: linking
      # a full command module goes through wasm-ld, which apt's clang package
      # does not ship.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang lld

      # Catches an accidental `std::fs`, `std::time::Instant` or native-only
      # dependency at the moment it is introduced. Every wasm-facing crate is
      # here: the shared model and UI, and both web modules.
      - name: Check wasm-clean crates
        run: cargo check --target wasm32-unknown-unknown -p vgms-core -p vgms-synth -p vgms-ui -p vgms-web -p vgms-synth-worklet -p vgms-cores -p vgms-pack-archive -p vgms-retrowave

      # The AudioWorklet module must import nothing (`AudioWorkletGlobalScope` has
      # no libc to offer it) and must actually sound. The node smoke asserts both
      # -- retiring the old "Step 9" TODO that asked for exactly this check.
      - name: Worklet module imports nothing and sounds
        run: |
          cargo build -p vgms-synth-worklet --lib --target wasm32-unknown-unknown --release
          node tools/web/worklet_smoke.mjs

      # The CLI's version must match the `wasm-bindgen` version Cargo.lock
      # resolves (pinned `=0.2.126` in vgms-web), or the generated glue will not
      # load. Bump both together.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      # The web build writes the files users keep, so byte parity with the native
      # build is a tested property, not an assumption. `.cargo/config.toml` points
      # the wasm32 target at `wasm-bindgen-test-runner`, which runs these in Node.
      - name: File-format round trips, as wasm
        run: cargo test -p vgms-core --target wasm32-unknown-unknown

      # Prove the whole web pipeline: the app module builds and wasm-bindgen
      # generates its glue. A mismatch between the CLI and the generated bindings
      # is a red build here rather than a blank page in a browser. (The full
      # servable bundle is assembled by tools/build-web.ps1; CI only needs the
      # glue-generation to succeed.)
      - name: Build the web app module and generate glue
        run: |
          cargo build -p vgms-web --lib --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --no-typescript \
            --out-dir target/web-dist --out-name vgms_web \
            target/wasm32-unknown-unknown/release/vgms_web.wasm

      # The native clippy job never sees the wasm-only modules, and the e2e hook
      # (`window.__vgms_e2e`, feature `e2e`) is wasm-only, so lint it here on the
      # wasm target with the feature on -- otherwise a warning in the hook only
      # surfaces in the web-e2e job's build, or not at all.
      - name: Lint the wasm-only + e2e code
        run: |
          rustup component add clippy
          cargo clippy -p vgms-web --target wasm32-unknown-unknown --features e2e --all-targets -- -D warnings

      # --- the wasip1 optimiser modules ---------------------------------------
      # The three vgmtools optimisers ship to the browser as wasm32-wasip1
      # command modules (tools/build-wasi-tools.ps1). Both gates below skip
      # silently when the modules are absent, so CI has to build them here or
      # the parity claim is never actually checked.

      # The sysroot + builtins downloads (~120 MB), keyed on the version pinned
      # in the build script: bumping $wasiVersion there rolls the cache with it.
      - name: Read the pinned wasi-sdk version
        id: wasi-sdk
        run: |
          version="$(grep -oP '(?<=\$wasiVersion = ")[^"]+' tools/build-wasi-tools.ps1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the wasi sysroot and builtins
        uses: actions/cache@v4
        with:
          path: target/wasi
          key: wasi-sdk-${{ steps.wasi-sdk.outputs.version }}

      - name: Build the wasip1 tool modules
        shell: pwsh
        run: ./tools/build-wasi-tools.ps1

      # Byte-parity against the native executables, over every repo fixture.
      # The test builds the native tools itself (build.rs), which is why it
      # lives in this job: ubuntu's host toolchain covers the native side while
      # the steps above cover the wasm side.
      - name: wasip1 tools match the native exes byte-for-byte
        run: cargo test -p vgms-vgmtools --test wasm_parity -- --ignored

      # And the second, independent WASI host: node runs each module end to end.
      - name: wasip1 tools run under node's WASI
        run: node tools/web/vgmtools_smoke.mjs target/wasi-tools tests/lsl3_score_up.vgm

  c-parity:
    name: pure-Rust OPL core == C reference
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # `opl3-rs` builds the original Nuked-OPL3 C sources with cc + bindgen.
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      # `nuked-opl3` is a young, single-maintainer port and the entire web build
      # rests on it being bit-exact. This runs the same register streams through
      # it and through Nuke.YKT's C and compares sample by sample.
      - name: Differential test against the C sources
        run: cargo test -p vgms-synth --features c-parity --test c_parity

  web-e2e:
    name: web e2e (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # The C sound cores compile to wasm through clang; the e2e build links them.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      # Assemble target/web-dist with the `e2e` feature on, so the page installs
      # the `window.__vgms_e2e` hook the specs drive. One source of truth: the
      # same script the native build runs (pwsh works on Ubuntu). -SkipWasiTools
      # omits the wasip1 optimisers and their wasi-sdk fetch, which these specs
      # never exercise; everything else -- including web/wasi-shim/, which
      # pack_worker.js imports at top level -- is copied by construction.
      - name: Build the e2e web bundle
        shell: pwsh
        run: ./tools/build-web.ps1 -E2e -SkipWasiTools

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the e2e harness
        working-directory: web-e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web-e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Run the web e2e suite
        working-directory: web-e2e
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web-e2e/playwright-report/
          retention-days: 7
