name: Check Rust

on:
  - push
  - pull_request

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The toolchain, its components and the wasm target all come from
      # rust-toolchain.toml, which rustup applies on the first cargo invocation.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  wasm:
    name: wasm32 cleanliness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # The C sound cores compile to wasm through clang (`-ffreestanding`); the
      # worklet and app modules link them, so the wasm job needs a C compiler
      # that can target wasm32.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      # Catches an accidental `std::fs`, `std::time::Instant` or native-only
      # dependency at the moment it is introduced. Every wasm-facing crate is
      # here: the shared model and UI, and both web modules.
      - name: Check wasm-clean crates
        run: cargo check --target wasm32-unknown-unknown -p vgms-core -p vgms-synth -p vgms-ui -p vgms-web -p vgms-synth-worklet -p vgms-pack-archive -p vgms-retrowave

      # The AudioWorklet module must import nothing (`AudioWorkletGlobalScope` has
      # no libc to offer it) and must actually sound. The node smoke asserts both
      # -- retiring the old "Step 9" TODO that asked for exactly this check.
      - name: Worklet module imports nothing and sounds
        run: |
          cargo build -p vgms-synth-worklet --lib --target wasm32-unknown-unknown --release
          node tools/web/worklet_smoke.mjs

      # The CLI's version must match the `wasm-bindgen` version Cargo.lock
      # resolves (pinned `=0.2.126` in vgms-web), or the generated glue will not
      # load. Bump both together.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      # The web build writes the files users keep, so byte parity with the native
      # build is a tested property, not an assumption. `.cargo/config.toml` points
      # the wasm32 target at `wasm-bindgen-test-runner`, which runs these in Node.
      - name: File-format round trips, as wasm
        run: cargo test -p vgms-core --target wasm32-unknown-unknown

      # Prove the whole web pipeline: the app module builds and wasm-bindgen
      # generates its glue. A mismatch between the CLI and the generated bindings
      # is a red build here rather than a blank page in a browser. (The full
      # servable bundle is assembled by tools/build-web.ps1; CI only needs the
      # glue-generation to succeed.)
      - name: Build the web app module and generate glue
        run: |
          cargo build -p vgms-web --lib --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --no-typescript \
            --out-dir target/web-dist --out-name vgms_web \
            target/wasm32-unknown-unknown/release/vgms_web.wasm

      # The native clippy job never sees the wasm-only modules, and the e2e hook
      # (`window.__vgms_e2e`, feature `e2e`) is wasm-only, so lint it here on the
      # wasm target with the feature on -- otherwise a warning in the hook only
      # surfaces in the web-e2e job's build, or not at all.
      - name: Lint the wasm-only + e2e code
        run: |
          rustup component add clippy
          cargo clippy -p vgms-web --target wasm32-unknown-unknown --features e2e --all-targets -- -D warnings

  c-parity:
    name: pure-Rust OPL core == C reference
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # `opl3-rs` builds the original Nuked-OPL3 C sources with cc + bindgen.
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      # `nuked-opl3` is a young, single-maintainer port and the entire web build
      # rests on it being bit-exact. This runs the same register streams through
      # it and through Nuke.YKT's C and compares sample by sample.
      - name: Differential test against the C sources
        run: cargo test -p vgms-synth --features c-parity --test c_parity

  web-e2e:
    name: web e2e (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # The C sound cores compile to wasm through clang; the e2e build links them.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      # Assemble target/web-dist with the `e2e` feature on, so the page installs
      # the `window.__vgms_e2e` hook the specs drive. Same steps as
      # tools/build-web.ps1, but Linux-native (the CJK font is optional and left
      # out -- the specs never touch Japanese tags).
      - name: Build the e2e web bundle
        run: |
          cargo build -p vgms-synth-worklet --lib --target wasm32-unknown-unknown --release
          cargo build -p vgms-web --lib --target wasm32-unknown-unknown --release --features e2e
          wasm-bindgen --target web --no-typescript \
            --out-dir target/web-dist --out-name vgms_web \
            target/wasm32-unknown-unknown/release/vgms_web.wasm
          cp target/wasm32-unknown-unknown/release/vgms_synth_worklet.wasm target/web-dist/
          cp web/index.html web/task_worker.js web/worklet-processor.js web/pack_worker.js target/web-dist/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the e2e harness
        working-directory: web/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web/e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Run the web e2e suite
        working-directory: web/e2e
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/e2e/playwright-report/
          retention-days: 7
