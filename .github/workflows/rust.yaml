name: Check Rust

on:
  - push
  - pull_request

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The toolchain, its components and the wasm target all come from
      # rust-toolchain.toml, which rustup applies on the first cargo invocation.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  wasm:
    name: wasm32 cleanliness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # Catches an accidental `std::fs`, `std::time::Instant` or native-only
      # dependency at the moment it is introduced, rather than at Step 8.
      - name: Check wasm-clean crates
        run: cargo check --target wasm32-unknown-unknown -p dro-core -p dro-synth -p dro-ui

      # The CLI's version must match the `wasm-bindgen` version Cargo.lock
      # resolves, or the generated glue will not load. Bump both together.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      # The web build writes the files users keep, so byte parity with the native
      # build is a tested property, not an assumption. `.cargo/config.toml` points
      # the wasm32 target at `wasm-bindgen-test-runner`, which runs these in Node.
      - name: File-format round trips, as wasm
        run: cargo test -p dro-core --target wasm32-unknown-unknown

  c-parity:
    name: pure-Rust OPL core == C reference
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # `opl3-rs` builds the original Nuked-OPL3 C sources with cc + bindgen.
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      # `nuked-opl3` is a young, single-maintainer port and the entire web build
      # rests on it being bit-exact. This runs the same register streams through
      # it and through Nuke.YKT's C and compares sample by sample.
      - name: Differential test against the C sources
        run: cargo test -p dro-synth --features c-parity --test c_parity

  # TODO (Step 9): once `dro-synth-worklet` exists as a cdylib, add a job that
  # builds it for wasm32 and asserts its import section is empty --
  # `AudioWorkletGlobalScope` has no libc to offer it. The `nuked-opl3` core is
  # pure Rust, so this holds today; the job is what notices if it stops holding.
