[package]
name = "dro-ui"
description = "The egui application as a library, parameterized by platform-service traits. Native and wasm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The app half: links whatever core is most accurate, including GPL-2/LGPL
# ones. See `licenses/README.md`.
license = "GPL-2.0-or-later"
authors.workspace = true
repository.workspace = true

[dependencies]
dro-core.workspace = true
dro-synth.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
# Feature-unifies png decoding into egui_extras' image loader (see workspace).
image.workspace = true
log.workspace = true

[dev-dependencies]
