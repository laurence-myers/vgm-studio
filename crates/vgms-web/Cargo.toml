[package]
name = "vgms-web"
description = "wasm-bindgen entry point: eframe::WebRunner plus the web platform services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The app half: links whatever core is most accurate, including GPL-2/LGPL
# ones. See `licenses/README.md`.
license = "GPL-2.0-or-later"
authors.workspace = true
repository.workspace = true

[lib]
# cdylib: the app module `wasm-bindgen --target web` post-processes into the
# page's glue. rlib: the codec's native tests, and the Worker/runner sharing the
# crate's own items. The `#[wasm_bindgen]` exports are all cfg(wasm32), so the
# native cdylib carries none.
crate-type = ["cdylib", "rlib"]

[features]
# Ships the e2e test hook and the OPFS picker shims (wt-6/wt-7). A debug/test-only
# feature; a release build never enables it, so the hook never reaches users.
# Enabling it turns on `vgms-ui/e2e` so the app exposes its action/state surface.
e2e = ["vgms-ui/e2e"]

[dependencies]
# The portable half: the codec that ships a background task across the Worker
# boundary. Native-buildable so its round-trip tests run in ordinary `cargo test`.
vgms-core.workspace = true
vgms-synth.workspace = true
vgms-ui.workspace = true
# The shared release-zip builder; the web supplies its own browser PNG note.
vgms-pack-archive.workspace = true
thiserror.workspace = true
log.workspace = true

# `zip` for reading a built archive back in the pack tests; `flate2` for the
# codec's own gzip. The builder's gzip now lives in `vgms-pack-archive`, but both
# stay wasm-clean (the `deflate-flate2` + `rust_backend` pinning is in the
# workspace manifest, keeping native and wasm .vgz byte-identical).
zip.workspace = true
flate2.workspace = true

# The wasm app module: the DOM-facing platform services and the Worker entry. All
# of this is `#[cfg(target_arch = "wasm32")]` in the source, so a native build (and
# the codec tests) never pulls it. Kept out of the workspace table because these
# are the only crate that needs them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned exactly to the `wasm-bindgen-cli` version CI installs: the generated glue
# and the CLI must match to the patch or the module will not load. Bump both together.
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# The egui web runner: WebRunner over eframe's default wgpu (WebGPU + WebGL2
# fallback). vgms-ui already pulls eframe for every target; naming it here lets
# the runner reach `eframe::WebRunner` directly.
eframe.workspace = true
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Storage",
    "Performance",
    "HtmlCanvasElement",
    "console",
    "Element",
    "HtmlElement",
    "Node",
    "Event",
    "EventTarget",
    "HtmlInputElement",
    "HtmlAnchorElement",
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "MessageEvent",
    "MessagePort",
    "DedicatedWorkerGlobalScope",
    "Response",
    "AudioContext",
    "AudioContextOptions",
    "BaseAudioContext",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "AudioNode",
    "AudioDestinationNode",
] }
# The Worker installs the same cores the worklet does before it runs a task, so
# a VGM waveform/render builds real chip cores. Depended on as an rlib.
vgms-synth-worklet.workspace = true
# The optimise pipeline (order, OPL bypass, ROM-size guard, chip hold-backs) and
# the shared run interpretation (`command_outcome`). On wasm this is pure Rust --
# the tools themselves are wasm32-wasip1 command modules built by
# tools/build-wasi-tools.ps1, fetched beside the app and hosted by
# pack_worker.js through the vendored browser_wasi_shim (web/wasi-shim/).
vgms-vgmtools = { workspace = true }

[lints]
workspace = true
