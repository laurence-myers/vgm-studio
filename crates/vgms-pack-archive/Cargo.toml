[package]
name = "vgms-pack-archive"
description = "An in-memory pack archive: unzip a .zip into the pack file set, mutate it with the native rename/delete/write semantics, and re-list it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# App tier: it exists to back pack mode, which is GPL-2.0-or-later. It links only
# `zip` (MIT/Apache), so this is a choice, not an obligation -- keeping it beside
# the other pack code rather than in the reusable `vgms-core`/`vgms-synth` pair.
license = "GPL-2.0-or-later"
authors.workspace = true
repository.workspace = true

[dependencies]
# Read and (in tests) write zips, in memory over a Cursor. Inherited from the
# workspace so the `deflate-flate2` + `rust_backend` pinning that keeps zip off
# the zlib-rs path -- and native and wasm VGZ output byte-identical -- lives in
# exactly one place. See the workspace manifest for the full reasoning.
zip.workspace = true
flate2.workspace = true

[lints]
workspace = true
