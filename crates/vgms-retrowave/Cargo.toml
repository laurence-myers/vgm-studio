[package]
name = "vgms-retrowave"
description = "Output to RetroWave OPL3 USB hardware: a real YMF262 driven over a CDC serial port. Native only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The app half: links whatever core is most accurate, including GPL-2/LGPL
# ones. See `licenses/README.md`.
license = "GPL-2.0-or-later"
authors.workspace = true
repository.workspace = true

[dependencies]
vgms-core.workspace = true
vgms-synth.workspace = true
log.workspace = true
thiserror.workspace = true

# The serial port and the OS-thread ring buffer are native-only: the web build
# reaches the board over Web Serial, not `serialport`, so it must not pull them
# (wt-9). The pure `protocol`/`commands`/`chip` modules -- everything a Web Serial
# transport would sit under -- stay on the unconditional deps above and so
# `cargo check -p vgms-retrowave --target wasm32-unknown-unknown` passes.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rtrb.workspace = true
serialport.workspace = true

[lints]
workspace = true
