[package]
name = "dro-cores-libvgm"
description = "Sound cores from the pinned libvgm submodule, wrapped for dro-synth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# **Read `src/lib.rs`'s licence note before believing this line.** libvgm ships
# no licence grant at all (no LICENSE, no COPYING, GitHub reports none), so this
# expression describes *our* wrapper, not the upstream it wraps. It is set to
# the app's copyleft tier because that is the most conservative home for a
# dependency whose terms are unresolved: it keeps libvgm out of the permissive
# half of the workspace (`dro-core`, `dro-synth`) in every case, whatever the
# grant turns out to be. See `docs/vgm-multichip-2026-07/LIBVGM-PLAN.md` lv-0.
license = "GPL-2.0-or-later"
authors.workspace = true
repository.workspace = true

[dependencies]
dro-core.workspace = true
dro-synth.workspace = true
# A device that refuses to start is reported rather than silently silent.
log.workspace = true

# The math half of the wasm libc shim: the cores build their volume tables
# with libc doubles, and wasm32-unknown-unknown has no libm to link. Pure
# Rust, deterministic IEEE -- which is what `ChipCore` demands anyway.
[target.'cfg(target_arch = "wasm32")'.dependencies]
libm = "0.2"

[build-dependencies]
cc.workspace = true

# The wasm smoke is a cdylib so the final link resolves every symbol the C
# objects reference -- an rlib check skips that entirely. On native it doubles
# as a runnable `cargo run --example wasm_smoke` printing the same numbers.
[[example]]
name = "wasm_smoke"
crate-type = ["cdylib"]

[lints.rust]
# As in the other provider crates: FFI needs unsafe, confined to `ffi.rs`.
unsafe_code = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
