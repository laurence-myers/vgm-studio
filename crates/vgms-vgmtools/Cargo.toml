[package]
name = "vgms-vgmtools"
description = "The vgmtools optimisers (vgm_cmp, vgm_sro, optdac) from the pinned submodule, callable as a library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# vgmtools is GPL-2.0 and ships a LICENSE file saying so, so unlike
# `vgms-cores-libvgm` this line is a real upstream grant rather than our most
# conservative guess. It keeps the tools in the copyleft half of the workspace:
# `vgms-ui` and `vgms-app` are already GPL-2.0-or-later and may link this,
# while `vgms-core` and `vgms-synth` stay MIT OR Apache-2.0 and never see it.
license = "GPL-2.0-or-later"
authors.workspace = true
repository.workspace = true

[dependencies]
# The chip list a caller needs to decide whether a file is worth handing over,
# and the header parse behind `passthrough_chips`.
vgms-core.workspace = true
# A tool that declines a file, or fails one, says so through the log rather
# than through stdout -- which this crate swallows.
log.workspace = true

[build-dependencies]
cc.workspace = true

[dev-dependencies]
# The golden tests read fixtures the same way the crate's callers will.
vgms-core.workspace = true
# Plenty of files named `.vgm` are gzip inside, so the corpus test unpacks
# them exactly as the app does before handing bytes to a tool.
flate2.workspace = true
# Drives the pre-built tool `.wasm` modules in `tests/wasm_parity.rs` so the
# native-vs-wasm byte-parity gate runs in an ordinary `cargo test`, no browser
# and no node. Pure Rust, so it needs no C toolchain of its own.
wasmi = "0.47"

# Each optimiser becomes its own `.wasm` module on `wasm32-unknown-unknown` --
# a cdylib so the final link resolves every symbol the C references (an rlib
# check would skip that), and separate targets so each gets its own linear
# memory, the wasm analogue of a separate process. The macro they invoke is a
# no-op off wasm, so `cargo build --examples` on the desktop just builds empty
# cdylibs. See `docs/vgm-multichip-2026-07/OPTIMIZER-WASM-PLAN.md`.
[[example]]
name = "tool_vgm_cmp"
crate-type = ["cdylib"]

[[example]]
name = "tool_vgm_sro"
crate-type = ["cdylib"]

[[example]]
name = "tool_optdac"
crate-type = ["cdylib"]

[lints.rust]
# The tool entry points are `extern "C"`, and the temp-file plumbing around
# them is safe Rust. Confined to `ffi.rs`, as in the provider crates.
unsafe_code = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
