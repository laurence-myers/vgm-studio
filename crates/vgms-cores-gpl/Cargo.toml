[package]
name = "vgms-cores-gpl"
description = "GPL-licensed emulator cores, compiled from pinned upstream submodules and registered into vgms-synth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The cores here are GPL-2.0-or-later, so this crate is too. A leaf: only the
# *application* depends on it, which is what keeps `vgms-synth` permissive and
# `vgms-cores-nuked` merely LGPL. See `licenses/README.md`.
license = "GPL-2.0-or-later"
authors.workspace = true
repository.workspace = true

[features]
# One feature for each core; the default builds them all. A consumer that
# wants fewer takes `default-features = false` and names its cores, e.g.
# `features = ["opl2-lite"]` for an OPL-only web player: the build then
# compiles only those cores' C and needs only their submodules. A build with
# no core is an error. (`vgms-synth` keeps its own default `nuked-opl`, so
# Nuked-OPL3 stays the OPL default beside these.)
default = ["opl2-lite", "opll", "psg", "lle"]
# Nuked-OPL2-Lite: a behavioural YM3812 (YM3526, Y8950).
opl2-lite = []
# Nuked-OPLL: YM2413 (and VRC VII).
opll = []
# Nuked-PSG: SN76489, the Sega VDP part.
psg = []
# The die simulations, each its own feature, and `lle` for all of them.
lle = ["ym2151-lle", "ym2203-lle", "ym2608-lle", "ym2612-lle", "ymf276-lle", "ym3812-lle", "ymf262-lle"]
ym2151-lle = []
ym2203-lle = []
ym2608-lle = []
ym2612-lle = []
ymf276-lle = []
ym3812-lle = []
ymf262-lle = []

[dependencies]
vgms-core.workspace = true
vgms-synth.workspace = true

[build-dependencies]
cc.workspace = true

[lints.rust]
# As in `vgms-cores-nuked`: FFI needs unsafe, and it is confined to `ffi.rs`.
unsafe_code = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
