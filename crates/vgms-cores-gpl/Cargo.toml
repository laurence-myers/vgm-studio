[package]
name = "vgms-cores-gpl"
description = "GPL-licensed emulator cores, compiled from pinned upstream submodules and registered into vgms-synth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The cores here are GPL-2.0-or-later, so this crate is too. A leaf: only the
# *application* depends on it, which is what keeps `vgms-synth` permissive and
# `vgms-cores-nuked` merely LGPL. See `licenses/README.md`.
license = "GPL-2.0-or-later"
authors.workspace = true
repository.workspace = true

[features]
# Nuked-OPL2-Lite is always built. The other cores are on by default, and each
# group is a feature, so a consumer that needs only an OPL2 model (an OPL-only
# web player) takes `default-features = false`: its build then compiles one C
# file, needs one submodule, and links none of the die simulations.
default = ["opll", "psg", "lle"]
# Nuked-OPLL (YM2413).
opll = []
# Nuked-PSG (SN76489, the Sega VDP part).
psg = []
# The die simulations: YM2151, YM2203, YM2608, YM2612, YMF276, YM3812, YMF262.
lle = []

[dependencies]
vgms-core.workspace = true
vgms-synth.workspace = true

[build-dependencies]
cc.workspace = true

[lints.rust]
# As in `vgms-cores-nuked`: FFI needs unsafe, and it is confined to `ffi.rs`.
unsafe_code = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
