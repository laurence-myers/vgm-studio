[package]
name = "dro-synth"
description = "OPL emulation and the pull-based playback engine. No threads, no audio device, no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# Builds the original Nuked-OPL3 C sources and exposes them as a second `OplChip`,
# so `tests/c_parity.rs` can assert the pure-Rust core is bit-identical to them.
#
# Off by default: it needs a C compiler and libclang, and `opl3-rs` cannot target
# wasm32-unknown-unknown. Never enable it for a wasm build.
#
#     cargo test -p dro-synth --features c-parity
c-parity = ["dep:opl3-rs"]

[dependencies]
dro-core.workspace = true
nuked-opl3.workspace = true
opl3-rs = { workspace = true, optional = true }

[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true
