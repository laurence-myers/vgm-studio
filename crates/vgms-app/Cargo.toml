[package]
name = "vgms-app"
description = "The vgmstudio executable: the GUI, plus its play, render and split subcommands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The app half: links whatever core is most accurate, including GPL-2/LGPL
# ones. See `licenses/README.md`.
license = "GPL-2.0-or-later"
authors.workspace = true
repository.workspace = true

[dependencies]
vgms-core.workspace = true
vgms-synth.workspace = true
vgms-audio-native.workspace = true
vgms-retrowave.workspace = true
vgms-cores-nuked.workspace = true
vgms-cores-gpl.workspace = true
vgms-cores-libvgm.workspace = true
# The shared common-core registration `install_cores` builds on.
vgms-cores.workspace = true
# The vgmtools optimisers. Desktop-only, which this binary is.
vgms-vgmtools.workspace = true
# Reads the reference player's WAV output for the parity harness.
hound.workspace = true
vgms-ui.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
eframe.workspace = true
env_logger.workspace = true
flate2.workspace = true
image = { workspace = true, features = ["ico"] }
log.workspace = true
oxipng.workspace = true
rfd.workspace = true
zip.workspace = true

# Windows-only: lets a GUI-subsystem release build borrow the parent console, so
# the subcommands' output is visible when vgmstudio is run from a terminal.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Windows-only: compiles src/dt.ico into the executable's resource table (see
# build.rs) so Explorer shows the app icon. Never pulled on other targets.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[lints]
workspace = true
