[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "5.1.0"
edition = "2024"
rust-version = "1.85"
# The OPL core (`nuked-opl3`, a port of Nuke.YKT's Nuked-OPL3) is
# LGPL-2.1-or-later, and it is statically linked into every artifact this
# workspace produces -- native binary and .wasm alike. The Rust workspace adopts
# the same licence rather than isolate it.
#
# The Python sources under `src/` remain MIT until they are removed. They already
# ship a GPL-3.0-only dependency (PyOPL 2.0), so that tree's effective licence is
# unchanged by this.
#
# TODO (Step 7, packaging): ship the LGPL-2.1 text alongside the binaries, and add
# a licence notice plus a source link to the About dialog (Step 6) and the web
# page (Step 8). LGPL section 6 requires both.
license = "LGPL-2.1-or-later"
authors = ["Laurence Dougal Myers"]
repository = "https://github.com/laurence-myers/dro-trimmer"

[workspace.dependencies]
dro-core = { path = "crates/dro-core" }
dro-synth = { path = "crates/dro-synth" }
dro-audio-native = { path = "crates/dro-audio-native" }
dro-ui = { path = "crates/dro-ui" }

# The GUI toolkit. 0.32 is the newest line whose MSRV (1.85) matches the
# workspace's; 0.33+ requires rustc 1.92. All three must move in lock-step.
eframe = "0.32.3"
egui = "0.32.3"
egui_extras = "0.32.3"
# Headless GUI test harness (dev-only, consumed by dro-ui's dev-dependencies).
# Moves in lock-step with egui/eframe above -- same 0.32 line, same MSRV. The
# `eframe` feature drives DroApp through `Harness`; `snapshot` + `wgpu` add
# PNG visual-regression rendering (via the DX12 WARP adapter on headless Windows).
egui_kittest = { version = "0.32.3", features = ["eframe", "snapshot", "wgpu"] }
# Native file dialogs (Step 6). The web build uses its own picker (Step 8).
rfd = "0.17"

# `rust_backend` is the pure-Rust inflate/deflate. Any crate enabling a `zlib*`
# feature would unify into it and break the wasm build, so pin it explicitly.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Pure-Rust WAV reader/writer. Writes to any `io::Write + Seek`, so a `Cursor`
# gives an in-memory render on native and web alike. wasm-clean (no `std::fs`).
hound = "3.5"
log = "0.4"
# Pure Rust port of Nuked-OPL3. Bit-identical to the C reference and free of the
# `cc` build step, so it compiles to wasm32-unknown-unknown with no C toolchain.
nuked-opl3 = "0.1"
# Bindings to the original Nuked-OPL3 *C* sources. Used only as a parity oracle
# behind dro-synth's off-by-default `c-parity` feature: it needs a C compiler and
# libclang, and it cannot target wasm32-unknown-unknown (no sysroot).
opl3-rs = "0.2"
# Package `rust-ini`, library `ini`. Default features are empty, which matches
# Python's configparser: no inline comments, no case-insensitive sections.
# Only `load_from_str` is used, so this stays wasm-clean.
rust-ini = { version = "0.21", default-features = false }
thiserror = "2"

# Native audio output. Only `dro-audio-native` (never wasm) depends on these: a
# cpal stream driven by the pull engine, with an rtrb SPSC queue carrying control
# commands into the audio callback lock-free.
cpal = "0.18"
rtrb = "0.3"

# CLI tooling for the `dro-trimmer` bins (native only).
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"

# `fork`/`timeout` are on by default and pull in process spawning (rusty-fork,
# tempfile), which is neither needed nor wasm-friendly.
proptest = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
wasm-bindgen-test = "0.3"

# `nuked-opl3` 0.1.0's `decoded_slot()` is:
#
#     let decoded = AD_SLOT[(regm & 0x1f) as usize];       // i8, -1 == "no such slot"
#     (decoded >= 0).then_some(18 * high + decoded as usize)
#
# `bool::then_some` evaluates its argument eagerly, so an invalid operator slot
# computes `18 * high + usize::MAX` before the `None` is returned. Nuke.YKT's C
# relies on exactly that wraparound and release builds reproduce it bit for bit --
# but Rust's debug overflow checks turn it into a panic, on 70 register numbers,
# 20 of which a real DRO capture can legitimately contain (0x26, 0x27, 0x2E, ...).
#
# Disable overflow checks for that one dependency until upstream takes a fix
# (`.then(|| ...)` instead of `.then_some(...)`). `dro-synth`'s
# `writing_a_gap_register_does_not_panic` test fails the moment this is removed.
[profile.dev.package.nuked-opl3]
overflow-checks = false
# The chip is the hot loop of playback and the offline waveform render. An
# unoptimised build emulates at roughly real time, so "render the waveform"
# took as long as the song; optimised it is two orders of magnitude faster.
opt-level = 3

[workspace.lints.rust]
# "deny", not "forbid": `dro-synth-worklet` must override this for its
# `#[unsafe(no_mangle)]` exports.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
