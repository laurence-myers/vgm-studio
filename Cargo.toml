[workspace]
resolver = "3"
members = ["crates/*"]
# The vendored `nuked-opl3` is a patch target, not a workspace member; keep it out
# of the `crates/*` glob's world so cargo never treats it as a member.
exclude = ["vendor/nuked-opl3"]

# Serve `nuked-opl3` from a locally patched copy (two upstream-PR-material fixes to
# the `stereo-ext` path; see vendor/nuked-opl3/README.dro-trimmer.md). The version
# and API are identical to 0.1.0, so `nuked-opl3 = "0.1"` above still resolves and
# the `[profile.dev.package.nuked-opl3]` tuning below still matches by name. Remove
# this and the vendor/ dir once a release carrying the fixes reaches crates.io.
[patch.crates-io]
nuked-opl3 = { path = "vendor/nuked-opl3" }

[workspace.package]
version = "5.1.0"
edition = "2024"
rust-version = "1.97"
# The OPL core (`nuked-opl3`, a port of Nuke.YKT's Nuked-OPL3) is
# LGPL-2.1-or-later, and it is statically linked into every artifact this
# workspace produces -- native binary and .wasm alike. The whole workspace is
# licensed the same way rather than isolate it. The full licence text is in
# `LICENSE` at the repo root, and the About dialog carries the notice plus the
# source link that LGPL section 6 requires.
license = "LGPL-2.1-or-later"
authors = ["Laurence Dougal Myers"]
repository = "https://github.com/laurence-myers/dro-trimmer"

[workspace.dependencies]
dro-core = { path = "crates/dro-core" }
dro-synth = { path = "crates/dro-synth" }
dro-audio-native = { path = "crates/dro-audio-native" }
dro-retrowave = { path = "crates/dro-retrowave" }
dro-ui = { path = "crates/dro-ui" }

# The GUI toolkit. All three move in lock-step (with egui_kittest below).
# Since 0.34, eframe's default renderer is wgpu -- glow left the default
# feature set, so drotrim renders via DX12/Vulkan on Windows.
eframe = "0.35"
egui = "0.35"
# `image` enables the byte-image loader for rip mode's inline screenshots; the
# codecs come from the `image` crate below (png only), so this stays wasm-clean.
egui_extras = { version = "0.35", features = ["image"] }
# PNG decoding for the screenshot previews. egui_extras declares `image` with no
# default features; enabling just `png` here keeps it pure Rust.
image = { version = "0.25", default-features = false, features = ["png"] }
# Headless GUI test harness (dev-only, consumed by dro-ui's dev-dependencies).
# Moves in lock-step with egui/eframe above -- same line, same MSRV. The
# `eframe` feature drives DroApp through `Harness`; `snapshot` + `wgpu` add
# PNG visual-regression rendering (via the DX12 WARP adapter on headless Windows).
egui_kittest = { version = "0.35", features = ["eframe", "snapshot", "wgpu"] }
# Native file dialogs (Step 6). The web build uses its own picker (Step 8).
rfd = "0.17"

# `rust_backend` is the pure-Rust inflate/deflate. Any crate enabling a `zlib*`
# feature would unify into it and break the wasm build, so pin it explicitly.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Pure-Rust WAV reader/writer. Writes to any `io::Write + Seek`, so a `Cursor`
# gives an in-memory render on native and web alike. wasm-clean (no `std::fs`).
hound = "3.5"
log = "0.4"
# Pure Rust port of Nuked-OPL3. Bit-identical to the C reference and free of the
# `cc` build step, so it compiles to wasm32-unknown-unknown with no C toolchain.
# `stereo-ext` enables the per-channel constant-power panpots (register 0xD0+ch)
# the GUI's channel panning drives; it is served by the patched vendor copy below.
nuked-opl3 = { version = "0.1", features = ["stereo-ext"] }
# Bindings to the original Nuked-OPL3 *C* sources. Used only as a parity oracle
# behind dro-synth's off-by-default `c-parity` feature: it needs a C compiler and
# libclang, and it cannot target wasm32-unknown-unknown (no sysroot).
opl3-rs = "0.2"
# Package `rust-ini`, library `ini`. Default features are empty, which matches
# Python's configparser: no inline comments, no case-insensitive sections.
# Only `load_from_str` is used, so this stays wasm-clean.
rust-ini = { version = "0.21", default-features = false }
thiserror = "2"

# Native audio output. Only `dro-audio-native` (never wasm) depends on these: a
# cpal stream driven by the pull engine, with an rtrb SPSC queue carrying control
# commands into the audio callback lock-free.
cpal = "0.18"
rtrb = "0.3"

# Serial port access for `dro-retrowave` (native only): the RetroWave OPL3 boards
# are USB CDC devices. MPL-2.0, so the About dialog carries its notice alongside
# the LGPL one. On Linux the default `libudev` feature needs libudev-dev; the
# workspace test job is Windows-only, and the Linux CI jobs are per-crate and
# exclude this crate.
serialport = "4.9"

# CLI tooling for the `drotrim` binary (native only).
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
# Console attaching for the GUI-subsystem release build (Windows only), so the
# subcommands can print when drotrim is started from a terminal. The 0.61 line
# unifies with the newest already in the lock file via transitive deps.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

# Rip-mode packaging (native only; never dro-core/dro-ui/wasm).
# `deflate-flate2` only, never the defaults: zip 8's default set enables
# `deflate-flate2-zlib-rs`, which would flip flate2 to its zlib-rs backend
# workspace-wide and *silently* break dro-core's native-vs-wasm VGZ byte parity
# (zlib-rs compiles fine on wasm; only the bytes drift). It also pulls zopfli.
# `deflate-flate2` is backend-neutral, so the backend comes solely from the
# flate2 `rust_backend` pin above.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
# PNG optimiser for the pack screenshots. Drop the CLI (`binary`) and `zopfli`;
# keep `parallel` (rayon). Pulls libdeflater, which builds the C libdeflate via
# `cc` -- native only, MSVC is already required.
oxipng = { version = "10.1", default-features = false, features = ["parallel"] }
# Local-timezone "today" for the prefilled package-history line. `clock` enables
# `Local::now()`; no default features (no oldtime, no wasm bindings).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Embeds the app icon into the drotrim.exe resource table so Windows Explorer
# shows it. A build-dependency, consumed only under `cfg(windows)` (the
# maintained `winres` fork). The window/taskbar icon is set at runtime from the
# same `src/dt.ico`.
winresource = "0.1"

# `fork`/`timeout` are on by default and pull in process spawning (rusty-fork,
# tempfile), which is neither needed nor wasm-friendly.
proptest = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
wasm-bindgen-test = "0.3"

# `nuked-opl3` 0.1.0's `decoded_slot()` is:
#
#     let decoded = AD_SLOT[(regm & 0x1f) as usize];       // i8, -1 == "no such slot"
#     (decoded >= 0).then_some(18 * high + decoded as usize)
#
# `bool::then_some` evaluates its argument eagerly, so an invalid operator slot
# computes `18 * high + usize::MAX` before the `None` is returned. Nuke.YKT's C
# relies on exactly that wraparound and release builds reproduce it bit for bit --
# but Rust's debug overflow checks turn it into a panic, on 70 register numbers,
# 20 of which a real DRO capture can legitimately contain (0x26, 0x27, 0x2E, ...).
#
# Disable overflow checks for that one dependency until upstream takes a fix
# (`.then(|| ...)` instead of `.then_some(...)`). `dro-synth`'s
# `writing_a_gap_register_does_not_panic` test fails the moment this is removed.
[profile.dev.package.nuked-opl3]
overflow-checks = false
# The chip is the hot loop of playback and the offline waveform render. An
# unoptimised build emulates at roughly real time, so "render the waveform"
# took as long as the song; optimised it is two orders of magnitude faster.
opt-level = 3

[workspace.lints.rust]
# "deny", not "forbid": `dro-synth-worklet` must override this for its
# `#[unsafe(no_mangle)]` exports.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
