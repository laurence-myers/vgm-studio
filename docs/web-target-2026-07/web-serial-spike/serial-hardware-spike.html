<!--
  wt-9(b): a no-Rust Web Serial hardware spike for the RetroWave OPL3.

  It requestPort()s with the board's USB VID/PID filter (04D8:E966), opens the
  CDC port, and replays a canned wire dump: the exact bring-up (IO-expander init,
  chip reset, mute sweep) + "NEW on" + a C-major chord, then a key-off. The bytes
  are NOT re-derived here -- they are generated by the real protocol code, so a
  framing mistake cannot creep in:

      cargo run -p vgms-retrowave --example dump_wire

  This board is write-only: it is verified by LISTENING. On a machine with the
  hardware attached, open this page (over https or http://localhost -- Web Serial
  needs a secure context), click Connect, pick the port, and you should hear a
  chord for ~1.5 s. Success is the go signal for a worker-hosted Web Serial pump
  (see the timing rehearsal and PLAN.md wt-9 for the go/no-go).

  It requires no build and no server beyond a secure context; Web Serial is
  Chromium-only.
-->

      // key-off:
      const KEY_OFF_HEX =
        "004309b9370f1903f7010102004309b9371f1903f7010102004309b9372f1903f7010102";

      const RETROWAVE_FILTER = { usbVendorId: 0x04d8, usbProductId: 0xe966 };

      const log = document.getElementById("log");
      const note = (message, cls) => {
        log.textContent = message;
        log.className = cls || "";
      };

      function hexToBytes(hex) {
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return bytes;
      }

      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      document.getElementById("go").addEventListener("click", async () => {
        if (!("serial" in navigator)) {
          note("This browser has no Web Serial. Use Chromium.", "err");
          return;
        }
        let port;
        try {
          note("choose the RetroWave port…");
          port = await navigator.serial.requestPort({ filters: [RETROWAVE_FILTER] });
          await port.open({ baudRate: 115200 });
          const writer = port.writable.getWriter();
          note("bring-up + key-on…");
          await writer.write(hexToBytes(KEY_ON_HEX));
          note("holding the chord (listen!)…", "ok");
          await wait(1500);
          await writer.write(hexToBytes(KEY_OFF_HEX));
          writer.releaseLock();
          await port.close();
          note("done — did you hear a chord? If so, Web Serial output works.", "ok");
        } catch (error) {
          note("failed: " + error, "err");
          try { if (port) await port.close(); } catch {}
        }
      });
